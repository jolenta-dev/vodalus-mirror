<script>
    function initGameBoard() {

        // create the nested arrays for the game state
        const size = 12;
        const gameBoard = Array.from({ length: size }, () =>
            Array.from({ length: size }, () => 0));
        console.log(gameBoard);

        // do the shennanigans to make the HTML objects
        const boardWrapper = document.getElementById("board-wrapper");
        let rowWrapper = []
        let letters = ["A", "B", "C", "D", "E", "F", "G", "H"]; // i feel really clever for this and just want to note that
        for (let i = 0; i < size; i++) {
            // create the row wrappers
            rowWrapper[i] = document.createElement(`row-wrapper-${i}`);
            rowWrapper[i].id = `row-wrapper-${i}`;
            rowWrapper[i].classList.add('row-wrapper');
            boardWrapper.appendChild(rowWrapper[i])
            for (let j = size - 1; j >= 0; j--) {
                // create the cells within
                gameBoard[i][j] = document.createElement(`cell-${i}-${j}`);
                gameBoard[i][j].id = `cell-${i}-${j}`
                gameBoard[i][j].classList.add('cell')
                //gameBoard[i][j].textContent = `${letters[i]}${(j + 1)}`;
                let stateSeed = Math.random();
                if (stateSeed > 0.5) {
                    gameBoard[i][j].classList.add('alive');
                } else {
                    gameBoard[i][j].classList.add('dead');
                }
                rowWrapper[i].appendChild(gameBoard[i][j]);
                // add the click toggle
                gameBoard[i][j].addEventListener("click", function toggleState() {
                    if (gameBoard[i][j].classList.contains('alive')) {
                        gameBoard[i][j].classList.remove("alive");
                        gameBoard[i][j].classList.add("dead");
                    } else {
                        gameBoard[i][j].classList.remove("dead");
                        gameBoard[i][j].classList.add("alive");
                    }
                });
            }
        }
    }
    initGameBoard();


    // shop handling
    function initShop(items) { // this is where i wish i was using typescript and could type items as int....

      let shopTiles = [];

      let tiles = [
      "tile1",
      "tile2",
      "tile3",
      "tile4",
      "tile5",
      "tile6",
      "tile7",
      "tile8",
      ]

      for (let i = 0; i < items; i++) {
        shopTiles[i] = document.createElement(`shop-tile-${i}`);
        shopTiles[i].id = `shop-tile-${i}`;
        shopTiles[i].classList.add('shop-tile');
        let randomTile = tiles[Math.floor(Math.random() * tiles.length)];
        shopTiles[i].textContent = `${randomTile}`; // doubt this will work
        document.getElementById("shop-tiles-wrapper").appendChild(shopTiles[i]);
        // TODO: let's make it so the tiles react on hover by floating around (balatro like) and let's also make it so they can be dragged onto the board
        // to do the dragging properly we'll also need the tiles to be removed when one is grabbed
        // no idea how we'll do board drop in without adding some kind of listener to every cell???
      }
    }

    document.getElementById("trigger-shop-btn").addEventListener('click', () => initShop(3));
</script>

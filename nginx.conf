worker_processes  1;

error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

# Load all installed modules
include modules.d/*.conf;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression (if needed)
    #gzip  on;

    # Common SSL settings - global
    ssl_protocols TLSv1.2 TLSv1.3;  # Strong SSL protocols
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';  # Strong ciphers

    sendfile        on;
    keepalive_timeout  65;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=media:10m rate=30r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Server block for media.vodalus.org (Jellyfin)
    server {
        listen 80;
        listen [::]:80;
        server_name media.vodalus.org;
	limit_req zone=media burst=50 nodelay;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # SSL server block for media.vodalus.org (Jellyfin)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name media.vodalus.org;
	limit_req zone=media burst=50 nodelay;

        ssl_certificate /etc/letsencrypt/live/media.vodalus.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/media.vodalus.org/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/media.vodalus.org/chain.pem;

        # Optional SSL parameters for security improvements
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # Managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # Managed by Certbot

        client_max_body_size 20M;

        location / {
            # Proxy Jellyfin traffic
            proxy_pass http://192.168.0.7:1317;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Protocol $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_buffering off;
        }

        location /socket {
            # Proxy Jellyfin Websockets traffic
            proxy_pass http://192.168.0.7:1317;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Protocol $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Optional: Add strict security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Server block for vodalus.org (HTML site)
    server {
        listen 80;
        listen [::]:80;
        server_name vodalus.org;
        # Redirect HTTP to HTTPS
	limit_req zone=general burst=20 nodelay;
	return 301 https://$host$request_uri;
    }

    # SSL server block for vodalus.org (HTML site)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name vodalus.org;
	limit_req zone=general burst=20 nodelay;

        ssl_certificate /etc/letsencrypt/live/vodalus.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vodalus.org/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/vodalus.org/chain.pem;

        # Optional SSL parameters for security improvements
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # Managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # Managed by Certbot

        root /vodalus;
        index home.html;

        location / {
            try_files $uri $uri/ =404;
        }
	location /chat {
		error_page 418 = @chat_ws;
		if ($http_upgrade = "websocket") {
			return 418;
		}
		try_files /pages/chat/chat.html =404;
	}

	location @chat_ws {
		proxy_pass http://localhost:3001;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header Cookie $http_cookie;
	}
	location /guestbook {
		try_files /pages/guestbook/guestbook.html =404;
	}
	location /atrium {
		try_files /pages/atrium/atrium.html =404;
	}
	location /journey {
		try_files /pages/journey/journey.html =404;
	}
	location /admin {
		try_files /pages/admin/admin.html =404;
	}
	location /tzadkiels-ship {
		try_files /pages/tzadkiels-ship/tzadkiels-ship.html =404;
	}
	location /about {
		try_files /pages/about/about.html =404;
	}
	location /botanic-gardens {
		try_files /pages/botanic-gardens/botanic-gardens.html =404;
	}
	location /conways {
		try_files /indev/conway.html =404;
	}
	location /board {
		try_files /indev/board.html =404;
	}
	location ^~ /api {
		proxy_pass http://127.0.0.1:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
    }


    # Optional: Default server block for any undefined requests
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;  # Catch-all server
        return 444;  # No response for unknown requests
    }
}

<body>
    <div id="placeholder">placeholder div</div>
    <script>
        function initSlidingDiv(messageContent) {
            var slidingDivContainer = document.createElement('div');
            slidingDivContainer.id = 'sliding-div-container';
            slidingDivContainer.innerHTML =
                '<div id="slidingDiv"></div>';
            var slidingDiv = slidingDivContainer.querySelector('#slidingDiv');
            slidingDiv.textContent = messageContent;

            Object.assign(slidingDiv.style, {
                fontSize: '36px',
                fontWeight: 'bold',
                border: 'solid',
                display: 'block',
                width: '200px',
                height: '200px',
                position: 'absolute',
                right: '0',
                top: '-200px',
                background: '#000',
                color: '#fff',
                transition: 'top 0.4s ease',
            });

            Object.assign(slidingDivContainer.style, {
                overflow: 'hidden',
                height: '200px',
                width: '200px',
                position: 'relative',
                background: '#333',
            });

            slidingDivContainer.addEventListener('mouseenter', function () {
                slidingDiv.style.top = '0';
            });
            slidingDivContainer.addEventListener('mouseleave', function () {
                slidingDiv.style.top = '-200px';
            });

            document.body.appendChild(slidingDivContainer);
        }

        initSlidingDiv('hwllo');
    </script>
</body>

<style>
    /* 3× the original 50px row — marquee + gif share this height */
    .theme {
        --theme-row-height: 150px;
        min-height: var(--theme-row-height);
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .theme-marquee {
        flex: 1;
        min-width: 0;
        height: var(--theme-row-height);
        overflow: hidden;
        position: relative;
    }
    /* Two identical groups; -50% scroll = one full group — seamless loop */
    .theme-track {
        display: flex;
        flex-wrap: nowrap;
        width: max-content;
        animation: theme-scroll 18s linear infinite;
        will-change: transform;
    }
    .theme-group {
        display: flex;
        flex-wrap: nowrap;
        flex-shrink: 0;
        align-items: center;
    }
    .theme-item {
        flex: 0 0 auto;
        flex-shrink: 0;
        height: var(--theme-row-height);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1.5rem;
        box-sizing: border-box;
    }
    .theme-item h3 {
        font-size: 9em;
        color: red;
        margin: 0;
        line-height: var(--theme-row-height);
        text-align: center;
        white-space: nowrap;
        animation: theme-blink 1s steps(1, end) infinite;
    }
    @keyframes theme-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }
    @keyframes theme-blink {
        0%, 33.32% { color: red; }
        33.33%, 66.65% { color: black; }
        66.66%, 100% { color: gold; }
    }
    @keyframes theme-blink-dim {
        0%, 33.32% { color: red; }
        33.33%, 66.65% { color: #fff; }
        66.66%, 100% { color: gold; }
    }
    html.site-dim--dim .theme-item h3 {
        animation-name: theme-blink-dim;
    }
    .theme-gif-left {
        flex: 0 0 auto;
        height: var(--theme-row-height);
        display: flex;
        align-items: center;
    }
    .theme-gif-left img {
        height: var(--theme-row-height);
        width: auto;
        display: block;
    }
    .theme-gif-right {
        flex: 0 0 auto;
        height: var(--theme-row-height);
        display: flex;
        align-items: center;
    }
    .theme-gif-right img {
        height: var(--theme-row-height);
        width: auto;
        display: block;
    }
    /* Color negative: keeps shading/detail (unlike brightness(0) invert which flattens to white) */
    html.site-dim--dim .theme-gif-left img,
    html.site-dim--dim .theme-gif-right img {
        filter: invert(0.8) contrast(1.5);
    }
</style>
<div class="theme">
    <div class="theme-gif-left">
        <img src="/assets/animations/coins.gif" alt="coinsleft">
    </div>
    <div class="theme-marquee">
        <div class="theme-track">
            <div class="theme-group">
                <div class="theme-item"><h3>GAMBLING</h3></div>
                <div class="theme-item"><h3>GAMBLING</h3></div>
                <div class="theme-item"><h3>GAMBLING</h3></div>
                <div class="theme-item"><h3>GAMBLING</h3></div>
            </div>
            <div class="theme-group" aria-hidden="true">
                <div class="theme-item"><h3>GAMBLING</h3></div>
                <div class="theme-item"><h3>GAMBLING</h3></div>
                <div class="theme-item"><h3>GAMBLING</h3></div>
                <div class="theme-item"><h3>GAMBLING</h3></div>
            </div>
        </div>
    </div>
    
    <div class="theme-gif-right">
        <img src="/assets/animations/coins.gif" alt="coinsright">
    </div>
</div>

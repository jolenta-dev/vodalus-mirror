<!DOCTYPE html>
<html class="site-form chat-page" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (new URLSearchParams(location.search).get('embed') === '1')
            document.documentElement.classList.add('page-embed');
    </script>
    <title>Botanic Gardens</title>
    <link rel="stylesheet" href="/pages/chat/chat.css">
    <link rel="stylesheet" href="/assets/stylesheets/site-controls.css">
    <link rel="stylesheet" href="/assets/stylesheets/sidebar.css">
    <link rel="stylesheet" href="/pages/botanic-gardens/botanic-gardens.css">
</head>

<body>
    <div w3-include-html="/assets/html/pointer-orbit.html"></div>

    <div id="site-sidebar-mount" data-src="/assets/html/sidebar.html"></div>
    <script src="/public/client/shared/sidebar-footer.js"></script>
    <div class="main">
        <div id="setup">
            <h1>Login</h1>
            <p><i>Enter a nickname to pass into the Botanic Gardens. If it's a new nickname, you'll be given the option
                    to claim it and
                    register a password. <br>If your name is already claimed, it'll prompt you for your password.</i>
            </p>
            <input id="input-name" placeholder="nickname"><!---comment to prevent whitespace insertion here
			--><button id="join-btn" type="button" data-sticky-follow>join</button>
        </div>
        <div id="botanic-gardens-container" style="display: none;">
            <h1>Father Inire's Botanic Gardens lie before you.</h1>
            <div id="click-area-wrapper">
                <div id="total-wrapper">
                    <div id="total-display">
                        <h1>Total: <span id="count"></span></h1>
                    </div>
                </div>
                <div id="button-wrapper">
                    <button id="button" type="button">click me!</button>
                </div>
            </div>

            <div id="menu-area-wrapper">
                <button id="upgrade1">LVL. <span id="upgrade1-level"></span> increase click (+ 1 per click)- <span id="upgrade1-cost"></span> (current: <span id="upgrade1-current"></span>)</button>
                <button id="upgrade2">LVL. <span id="upgrade2-level"></span> passive income (+ 1 click per interval) - <span id="upgrade2-cost"></span> (current: <span id="upgrade2-current"></span>)</button>
                <button id="upgrade3">LVL. <span id="upgrade3-level"></span> auto click faster (halve the time between clicks) - <span id="upgrade3-cost"></span> (current: <span id="upgrade3-current"></span>)</button>
                <button id="upgrade4">LVL. <span id="upgrade4-level"></span> hold to click (unlock -> -100ms between clicks)- <span id="upgrade4-cost"></span> (current: <span id="upgrade4-current"></span>)</button>
                <button id="upgrade5">LVL. <span id="upgrade5-level"></span> explosions (unlock -> +10% chance & x1.5 explosion quantity) - <span id="upgrade5-cost"></span> (current: <span id="upgrade5-current"></span>)</button>
            </div>
        </div>
        <div id="password-modal-overlay" style="display: none;">
            <div id="password-modal">
                <p id="password-modal-message"></p>
                <input type="password" id="password-modal-input" placeholder="Password">
                <label><input type="checkbox" id="password-modal-reveal">Reveal</label>
                <button id="password-modal-ok" type="button">Join</button>
                <button id="password-modal-cancel" type="button">Cancel</button>
            </div>
        </div>
    </div>
</body>
<script src="/public/client/pages/botanic-gardens/botanic-gardens.js"></script>
<script src="/public/client/shared/include-html.js"></script>

</html>
